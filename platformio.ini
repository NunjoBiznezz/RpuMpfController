; RpuMPFController — LISY protocol firmware for RPU v102
; Board and framework will be confirmed when RPU hardware is integrated.
; Placeholder uses Arduino Uno (ATmega328P) which is pin-compatible with
; the RPU v102 Arduino slot.

[env:rpuv102]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
upload_speed = 115200

build_flags =
    -DSERIAL_BAUD=115200
