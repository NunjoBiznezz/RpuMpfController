; PlatformIO Project Configuration File

[common_settings]
;build_src_filter =
;   +/<src>

[zero_settings]
platform = atmelsam
board = zero
debug_tool = cmsis-dap
monitor_speed = 115200
framework = arduino

[rev3_settings]
extends = common_settings
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
build_flags =
   -DRPU_OS_HARDWARE_REV=3
   -DRPU_MPU_ARCHITECTURE=1
   -DRPU_MPU_BUILD_FOR_6800=1
   -DRPU_OS_USE_WAV_TRIGGER_1p3=1
   -DRPU_OS_USE_DIP_SWITCHES
   -DRPU_OS_USE_SB100

[rev4_settings]
extends = common_settings
platform = atmelavr
board = megaatmega2560
monitor_speed = 115200
framework = arduino
build_flags =
   -DRPU_OS_HARDWARE_REV=4
   -DRPU_MPU_ARCHITECTURE=1
   -DRPU_MPU_BUILD_FOR_6800=1
   -DRPU_OS_USE_DIP_SWITCHES
   -DRPU_OS_USE_SB100

[rev102_settings]
extends = common_settings
platform = atmelavr
board = megaatmega2560
monitor_speed = 115200
framework = arduino
build_flags =
   -DRPU_OS_HARDWARE_REV=102
   -DRPU_MPU_ARCHITECTURE=1
   -DRPU_MPU_BUILD_FOR_6800=1
   -DRPU_OS_USE_DIP_SWITCHES
   -DRPU_OS_USE_SB100

; Dedicated minimal environment for Mega 2560 serial comms tests
[env:mega_hello]
extends = rev102_settings, mpf_controller_app
; Keep lib_deps empty so only the app is compiled; AVR core is provided by framework
build_flags =
   ${rev102_settings.build_flags}
   ${mpf_controller_app.build_flags}
   -DTARGET_MEGA
   -DMEGA_COMM


; *********************************************************************************************
; Classic Trident app environments
; *********************************************************************************************

[mpf_controller_app]
; Keep lib_deps empty so only the app is compiled; AVR core is provided by framework
lib_deps = RPU

build_src_filter =
; Stern Trident machine counts. These are hardcoded for Trident as the only
; supported machine. When additional machines are added, split these into
; per-environment sections.
build_flags =
    -DMACHINE_NUM_SWITCHES=34
    -DMACHINE_NUM_SOLENOIDS=15
    -DMACHINE_NUM_LAMPS=60
    -DMACHINE_NUM_DISPLAYS=6
    -DMACHINE_DISPLAY_TYPE=3
    -DMACHINE_DISPLAY_DIGITS=6


[env:mpf_controller_v3]
extends = rev3_settings, mpf_controller_app
build_flags =
   ${rev3_settings.build_flags}
   ${mpf_controller_app.build_flags}

[env:mpf_controller_v4]
extends = rev4_settings, mpf_controller_app
build_flags =
   ${rev4_settings.build_flags}
   ${mpf_controller_app.build_flags}

[env:mpf_controller_v102]
extends = rev102_settings, mpf_controller_app
build_flags =
   ${rev102_settings.build_flags}
   ${mpf_controller_app.build_flags}



