; PlatformIO Project Configuration File

[common_settings]
;build_src_filter =
;   +/<src>

[zero_settings]
platform = atmelsam
board = zero
debug_tool = cmsis-dap
monitor_speed = 115200
framework = arduino

[rev3_settings]
extends = common_settings
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
build_flags = -DBOARD_RPU_V3

[rev4_settings]
extends = common_settings
platform = atmelavr
board = megaatmega2560
monitor_speed = 115200
framework = arduino
build_flags = -DBOARD_RPU_V4

[rev102_settings]
extends = common_settings
platform = atmelavr
board = megaatmega2560
monitor_speed = 115200
framework = arduino
build_flags = -DBOARD_RPU_V102

; Dedicated minimal environment for Mega 2560 serial comms tests
[env:mega_hello]
extends = rev102_settings, mpf_controller_app
build_flags =
   ${rev102_settings.build_flags}
   ${mpf_controller_app.build_flags}
   -DTARGET_MEGA
   -DMEGA_COMM


; *********************************************************************************************
; Classic Trident app environments
; *********************************************************************************************

[mpf_controller_app]
build_src_filter =
build_flags = -DMACHINE_STERN_TRIDENT


[env:mpf_controller_v3]
extends = rev3_settings, mpf_controller_app
build_flags =
   ${rev3_settings.build_flags}
   ${mpf_controller_app.build_flags}

[env:mpf_controller_v4]
extends = rev4_settings, mpf_controller_app
build_flags =
   ${rev4_settings.build_flags}
   ${mpf_controller_app.build_flags}

[env:mpf_controller_v102]
extends = rev102_settings, mpf_controller_app
build_flags =
   ${rev102_settings.build_flags}
   ${mpf_controller_app.build_flags}



